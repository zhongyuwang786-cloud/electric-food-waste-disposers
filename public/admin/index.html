<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<title>询盘管理后台</title>
<style>
:root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#182b28;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:0 auto;padding:28px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:25px;margin:0}.muted{color:#687875;font-size:13px}.panel{background:#fff;border:1px solid #dce5e2;border-radius:12px;padding:18px;margin-top:18px}.tools{display:flex;gap:10px;flex-wrap:wrap}.tools input,.tools select,button{font:inherit;padding:10px 12px;border:1px solid #cbd8d4;border-radius:7px;background:#fff;color:#182b28}.tools input{flex:1;min-width:210px}button{cursor:pointer;background:#173d36;color:white;border-color:#173d36}button:disabled{opacity:.55;cursor:wait}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e7eeeb;vertical-align:top;font-size:14px}th{font-size:12px;color:#60716d;background:#f8faf9}td.message{white-space:pre-wrap;min-width:230px;max-width:330px;overflow-wrap:anywhere}.status{min-width:125px;padding:7px;border:1px solid #cbd8d4;border-radius:6px;background:white}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}.error{color:#a12626}.empty{padding:30px;text-align:center;color:#687875}.actions{display:flex;gap:8px;align-items:center}.small{font-size:12px;color:#687875}@media(max-width:600px){.wrap{padding:18px 12px}h1{font-size:21px}.panel{padding:12px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><h1>询盘管理</h1><p class="muted">Electric Food Waste Disposers · 内部管理页面</p></div><button id="refresh">刷新列表</button></header>
<section class="panel">
<h2 style="font-size:18px;margin:0 0 8px">AI 翻译测试</h2>
<p class="muted">输入英文内容，测试 Workers AI 翻译。当前先开放简体中文及其他已配置语言；繁体中文将在加入文字转换步骤后启用。</p>
<div class="tools">
<textarea id="translateInput" rows="4" placeholder="Enter English product description…" style="width:100%;min-height:100px;padding:10px;border:1px solid #cbd8d4;border-radius:7px;font:inherit"></textarea>
<select id="translateTarget" aria-label="目标语言">
<option value="japanese">日语</option><option value="korean">韩语</option><option value="spanish">西班牙语</option><option value="portuguese">葡萄牙语</option><option value="german">德语</option><option value="russian">俄语</option><option value="arabic">阿拉伯语</option><option value="chinese">简体中文</option>
</select>
<button id="translateButton" type="button">测试翻译</button>
</div>
<p id="translateNotice" class="muted" role="status" aria-live="polite">翻译结果会显示在下方。</p>
<div id="translateResult" style="white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f8faf9;border-radius:7px;min-height:42px"></div>
</section>
<section class="panel">
<div class="tools">
<input id="q" type="search" placeholder="搜索姓名、公司或邮箱">
<select id="status"><option value="">全部状态</option><option value="new">新询盘</option><option value="contacted">已联系</option><option value="qualified">有效客户</option><option value="closed">已完成</option><option value="spam">垃圾询盘</option></select>
<button id="search">搜索</button><button id="export">导出 CSV</button>
</div>
<p id="notice" class="muted" role="status" aria-live="polite">正在检查访问权限并加载询盘…</p>
<div class="table-wrap"><table><thead><tr><th>时间</th><th>联系人 / 公司</th><th>邮箱</th><th>市场</th><th>留言</th><th>语言</th><th>跟进状态</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody></table></div>
<div class="meta"><span id="count" class="small"></span><div class="actions"><button id="prev" disabled>上一页</button><span id="page" class="small">第 1 页</span><button id="next" disabled>下一页</button></div></div>
</section>
<p class="small">安全提示：请勿在公共或共享设备上使用此页面。退出时关闭浏览器窗口。</p>
</main>
<script src="/admin/admin.js" defer></script>
</body>
</html>
